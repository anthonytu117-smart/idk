<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>那群跟我變美(發酒癲）的朋友回憶錄</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PeerJS CDN for Realtime Cross-Device Sync -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            japandi: {
              bg: '#F7F4EF',          // 暖米白/棉麻色
              card: '#FAF8F5',        // 卡片底色
              cardHover: '#F2EDE4',   // 卡片懸停
              border: '#E8E2D8',      // 細微邊框
              text: '#2D2B28',        // 胡桃木深黑
              muted: '#8C857B',      // 柔和灰褐
              accent: '#3D3A36',     // 主要深色按鈕
              primary: '#8B263E',    // 酒紅特色點綴
              primaryLight: '#F7EBEF',
              sober: '#4A6B5D',      // ✨ 清醒變美
              leave: '#C68B29',      // 🍹 喝茫請假
              late: '#D96B43',       // 🥴 微醺遲到
              absent: '#B83A3A'      // 🤪 發酒癲失聯
            }
          },
          fontFamily: {
            sans: ['"PingFang TC"', '"Hiragino Sans GB"', '"Microsoft JhengHei"', '-apple-system', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #F7F4EF;
      color: #2D2B28;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .long-press-active {
      transform: scale(0.97);
      transition: transform 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .progress-bar {
      transition: width 0.5s linear;
    }
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: #F7F4EF;
    }
    ::-webkit-scrollbar-thumb {
      background: #D8D0C5;
      border-radius: 2px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans antialiased pb-12">

  <!-- Top Header -->
  <header class="bg-[#FAF8F5] border-b border-japandi-border sticky top-0 z-30 shadow-sm">
    <div class="max-w-3xl mx-auto px-4 py-3 flex flex-col sm:flex-row justify-between items-center gap-2">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-japandi-primary text-white flex items-center justify-center text-xl shadow-sm">
          🍷
        </div>
        <div>
          <h1 class="text-base sm:text-lg font-bold tracking-tight text-japandi-text">那群跟我變美(發酒癲）的朋友回憶錄</h1>
          <p class="text-[11px] text-japandi-muted font-medium tracking-wider uppercase">Beauty & Drunk Friend Tracker</p>
        </div>
      </div>
      
      <!-- Sync Room Box -->
      <div class="flex items-center space-x-2 bg-japandi-bg px-3 py-1.5 rounded-xl border border-japandi-border text-xs">
        <div class="flex items-center space-x-1.5">
          <span id="syncStatusDot" class="w-2 h-2 rounded-full bg-amber-400 inline-block animate-pulse"></span>
          <span class="text-japandi-muted font-medium">房間:</span>
          <span id="roomIdDisplay" class="font-mono font-bold text-japandi-text">建立中...</span>
        </div>
        <button onclick="copyShareLink()" class="ml-2 bg-white px-2.5 py-1 rounded-lg border border-japandi-border hover:bg-japandi-cardHover text-japandi-accent font-medium text-[11px] transition shadow-xs">
          複製共享連結
        </button>
      </div>
    </div>
  </header>

  <!-- Navigation Tabs -->
  <div class="bg-[#FAF8F5] border-b border-japandi-border">
    <div class="max-w-3xl mx-auto px-4">
      <div class="flex p-1 bg-japandi-bg rounded-xl border border-japandi-border my-2 text-xs font-medium">
        <button id="tab1Btn" onclick="switchTab(1)" class="flex-1 py-2 rounded-lg bg-white text-japandi-text font-bold shadow-xs transition flex items-center justify-center space-x-1.5">
          <span>👥</span><span>朋友名冊</span>
        </button>
        <button id="tab2Btn" onclick="switchTab(2)" class="flex-1 py-2 rounded-lg text-japandi-muted hover:text-japandi-text transition flex items-center justify-center space-x-1.5">
          <span>📅</span><span>酒瘋點名日曆</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Main Content Container -->
  <main class="max-w-3xl mx-auto px-4 py-5 flex-1 w-full">

    <!-- PAGE 1: Friends Management -->
    <section id="page1" class="space-y-5">
      <!-- Add Member Box -->
      <div class="bg-[#FAF8F5] p-5 rounded-2xl border border-japandi-border shadow-xs space-y-3">
        <h2 class="text-xs font-bold uppercase tracking-wider text-japandi-primary flex items-center space-x-1.5">
          <span>📍</span><span>邀請酒友 / 閨蜜加入</span>
        </h2>
        <div class="space-y-2">
          <input type="text" id="newMemberName" placeholder="請輸入朋友暱稱（例如：喝酒奇俠、美妝小天才）" 
                 class="w-full px-4 py-3 bg-japandi-bg border border-japandi-border rounded-xl text-sm text-japandi-text placeholder:text-japandi-muted focus:outline-none focus:border-japandi-accent transition">
          <button onclick="addMember()" class="w-full bg-japandi-accent text-white py-3 rounded-xl text-sm font-semibold hover:opacity-95 active:scale-[0.99] transition shadow-xs flex items-center justify-center space-x-1">
            <span>+</span><span>入冊加入</span>
          </button>
        </div>
      </div>

      <!-- Member List Box -->
      <div class="bg-[#FAF8F5] p-5 rounded-2xl border border-japandi-border shadow-xs space-y-4">
        <div class="flex justify-between items-center border-b border-japandi-border pb-3">
          <div class="flex items-center space-x-2">
            <h2 class="text-sm font-bold text-japandi-text">酒瘋閨蜜總覽</h2>
            <span id="memberCountBadge" class="px-2 py-0.5 bg-japandi-bg border border-japandi-border rounded-md text-[11px] font-mono text-japandi-muted">0 位朋友</span>
          </div>
          <div class="flex space-x-2">
            <button onclick="exportData()" class="text-xs text-japandi-muted hover:text-japandi-text flex items-center space-x-1 transition">
              <span>📥</span><span>備份戰績</span>
            </button>
            <button onclick="document.getElementById('importFile').click()" class="text-xs text-japandi-muted hover:text-japandi-text flex items-center space-x-1 transition">
              <span>📤</span><span>還原戰績</span>
            </button>
            <input type="file" id="importFile" accept=".json" class="hidden" onchange="importData(event)">
          </div>
        </div>

        <div id="memberList" class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
          <!-- Dynamically populated card items -->
        </div>
      </div>
    </section>

    <!-- PAGE 2: Calendar & Roll Call -->
    <section id="page2" class="space-y-5 hidden">
      <!-- Controls Header -->
      <div class="bg-[#FAF8F5] p-4 rounded-2xl border border-japandi-border shadow-xs flex flex-col sm:flex-row justify-between items-center gap-3">
        <!-- Target Selection -->
        <div class="flex items-center space-x-2 w-full sm:w-auto">
          <label class="text-xs font-bold text-japandi-muted whitespace-nowrap">對象：</label>
          <select id="memberFilter" onchange="renderCalendar()" class="bg-japandi-bg border border-japandi-border px-3 py-2 rounded-xl text-xs font-semibold text-japandi-text focus:outline-none w-full">
            <option value="ALL">全體成員總覽</option>
          </select>
        </div>

        <!-- Month Navigation -->
        <div class="flex items-center space-x-3 bg-japandi-bg px-3 py-1.5 rounded-xl border border-japandi-border">
          <button onclick="changeMonth(-1)" class="text-xs font-bold text-japandi-muted hover:text-japandi-text px-1">◀</button>
          <span id="currentMonthLabel" class="text-xs font-bold font-mono text-japandi-text">2026 年 09 月</span>
          <button onclick="changeMonth(1)" class="text-xs font-bold text-japandi-muted hover:text-japandi-text px-1">▶</button>
        </div>
      </div>

      <!-- Long Press Guide -->
      <div class="bg-japandi-primaryLight p-3 rounded-xl border border-japandi-primary/20 text-xs text-japandi-primary flex items-center justify-between">
        <span>💡 <b>長按提示：</b>在日曆格子上<b>長按 0.5 秒</b>即可發動醉酒點名、備註與上傳照片！</span>
      </div>

      <!-- Calendar Grid -->
      <div class="bg-[#FAF8F5] p-4 rounded-2xl border border-japandi-border shadow-xs">
        <!-- Weekday Headers -->
        <div class="grid grid-cols-7 gap-1 text-center font-bold text-xs text-japandi-muted py-2 border-b border-japandi-border mb-2">
          <div class="text-japandi-absent">日</div>
          <div>一</div>
          <div>二</div>
          <div>三</div>
          <div>四</div>
          <div>五</div>
          <div class="text-japandi-leave">六</div>
        </div>

        <!-- Days Cells -->
        <div id="calendarGrid" class="grid grid-cols-7 gap-1.5 sm:gap-2">
          <!-- Dynamically Generated -->
        </div>
      </div>

      <!-- Monthly Stats -->
      <div class="bg-[#FAF8F5] p-5 rounded-2xl border border-japandi-border shadow-xs space-y-3">
        <h3 class="text-xs font-bold text-japandi-text uppercase tracking-wider">📊 本月醉酒戰績統計</h3>
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5 text-center">
          <div class="p-3 rounded-xl bg-japandi-bg border border-japandi-border">
            <div class="text-[11px] font-medium text-japandi-sober">✨ 清醒變美</div>
            <div id="statSober" class="text-lg font-bold font-mono text-japandi-text mt-0.5">0</div>
          </div>
          <div class="p-3 rounded-xl bg-japandi-bg border border-japandi-border">
            <div class="text-[11px] font-medium text-japandi-leave">🍹 喝茫請假</div>
            <div id="statLeave" class="text-lg font-bold font-mono text-japandi-text mt-0.5">0</div>
          </div>
          <div class="p-3 rounded-xl bg-japandi-bg border border-japandi-border">
            <div class="text-[11px] font-medium text-japandi-late">🥴 微醺遲到</div>
            <div id="statLate" class="text-lg font-bold font-mono text-japandi-text mt-0.5">0</div>
          </div>
          <div class="p-3 rounded-xl bg-japandi-bg border border-japandi-border">
            <div class="text-[11px] font-medium text-japandi-absent">🤪 發酒癲失聯</div>
            <div id="statAbsent" class="text-lg font-bold font-mono text-japandi-text mt-0.5">0</div>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- ROLL CALL & MEMORY MODAL -->
  <div id="rollCallModal" class="fixed inset-0 bg-black/30 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-[#FAF8F5] rounded-3xl border border-japandi-border max-w-md w-full p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b border-japandi-border pb-3">
        <div>
          <h3 id="modalTitle" class="font-bold text-base text-japandi-text">日曆點名與回憶錄</h3>
          <p id="modalSubTitle" class="text-xs text-japandi-muted mt-0.5"></p>
        </div>
        <button onclick="closeModal()" class="text-japandi-muted hover:text-japandi-text text-xl font-bold">✕</button>
      </div>

      <!-- Member Selector -->
      <div id="modalMemberSelectGroup" class="space-y-1">
        <label class="text-xs font-semibold text-japandi-muted">選擇點名對象：</label>
        <select id="modalMemberSelect" class="w-full bg-japandi-bg border border-japandi-border px-3 py-2.5 rounded-xl text-xs font-semibold text-japandi-text focus:outline-none">
          <!-- Dynamically populated -->
        </select>
      </div>

      <!-- Status Options -->
      <div class="space-y-2">
        <label class="text-xs font-semibold text-japandi-muted">選擇醉酒狀態：</label>
        <div class="grid grid-cols-2 gap-2">
          <button type="button" onclick="selectStatus('sober')" id="statusBtn_sober" class="p-3 border border-japandi-border rounded-2xl text-xs font-bold flex items-center space-x-2 transition">
            <span class="w-2.5 h-2.5 rounded-full bg-japandi-sober inline-block"></span>
            <span>✨ 清醒變美</span>
          </button>
          <button type="button" onclick="selectStatus('leave')" id="statusBtn_leave" class="p-3 border border-japandi-border rounded-2xl text-xs font-bold flex items-center space-x-2 transition">
            <span class="w-2.5 h-2.5 rounded-full bg-japandi-leave inline-block"></span>
            <span>🍹 喝茫請假</span>
          </button>
          <button type="button" onclick="selectStatus('late')" id="statusBtn_late" class="p-3 border border-japandi-border rounded-2xl text-xs font-bold flex items-center space-x-2 transition">
            <span class="w-2.5 h-2.5 rounded-full bg-japandi-late inline-block"></span>
            <span>🥴 微醺遲到</span>
          </button>
          <button type="button" onclick="selectStatus('absent')" id="statusBtn_absent" class="p-3 border border-japandi-border rounded-2xl text-xs font-bold flex items-center space-x-2 transition">
            <span class="w-2.5 h-2.5 rounded-full bg-japandi-absent inline-block"></span>
            <span>🤪 發酒癲失聯</span>
          </button>
        </div>
      </div>

      <!-- Photo Upload Box -->
      <div class="space-y-1.5">
        <label class="text-xs font-semibold text-japandi-muted">📷 上傳當日發酒癲 / 變美照回憶：</label>
        <div class="flex items-center space-x-3 bg-japandi-bg p-3 rounded-2xl border border-japandi-border">
          <div id="photoPreviewContainer" class="w-14 h-14 rounded-xl bg-japandi-card border border-japandi-border overflow-hidden flex items-center justify-center shrink-0">
            <span class="text-japandi-muted text-xs">無照片</span>
          </div>
          <div class="flex-1 space-y-1">
            <input type="file" id="photoInput" accept="image/*" class="hidden" onchange="handlePhotoUpload(event)">
            <button type="button" onclick="document.getElementById('photoInput').click()" class="px-3 py-1.5 bg-white border border-japandi-border rounded-xl text-xs font-semibold text-japandi-accent hover:bg-japandi-cardHover transition">
              選擇相片...
            </button>
            <button type="button" id="removePhotoBtn" onclick="removePhoto()" class="px-2 py-1 text-[11px] text-japandi-absent hover:underline hidden">
              移除照片
            </button>
          </div>
        </div>
      </div>

      <!-- Note Input -->
      <div class="space-y-1">
        <label class="text-xs font-semibold text-japandi-muted">戰績與事由備註：</label>
        <input type="text" id="modalNote" placeholder="例：紅酒 2 瓶、敷面膜中、發酒癲斷片" 
               class="w-full bg-japandi-bg border border-japandi-border px-3 py-2.5 rounded-xl text-xs text-japandi-text focus:outline-none">
      </div>

      <!-- Action Buttons -->
      <div class="flex justify-between items-center pt-2">
        <button onclick="clearRecord()" class="text-xs text-japandi-absent hover:underline">刪除本日紀錄</button>
        <div class="flex space-x-2">
          <button onclick="closeModal()" class="px-4 py-2 border border-japandi-border rounded-xl text-xs font-medium text-japandi-muted hover:bg-japandi-bg">取消</button>
          <button onclick="saveRollCall()" class="px-5 py-2 bg-japandi-accent text-white rounded-xl text-xs font-semibold hover:opacity-90">儲存並同步</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // --- Application State ---
    let appState = {
      members: ['美麗擔當 莉莉', '酒王 威廉', '酒瘋戰術大師 Eva'],
      records: {}, 
      currentYear: new Date().getFullYear(),
      currentMonth: new Date().getMonth()
    };

    let selectedDateStr = '';
    let currentSelectedStatus = 'sober';
    let currentPhotoBase64 = null;
    let peer = null;
    let connections = [];
    let myRoomId = '';

    // --- Core Initialization ---
    window.addEventListener('DOMContentLoaded', () => {
      loadLocalStorage();
      setupPeerSync();
      renderMembers();
      renderCalendar();
    });

    // --- Local Storage ---
    function loadLocalStorage() {
      const saved = localStorage.getItem('japandi_drunk_memoirs_data');
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          if (parsed.members) appState.members = parsed.members;
          if (parsed.records) appState.records = parsed.records;
        } catch(e) {
          console.error(e);
        }
      }
    }

    function saveData(broadcast = true) {
      localStorage.setItem('japandi_drunk_memoirs_data', JSON.stringify({
        members: appState.members,
        records: appState.records
      }));

      if (broadcast) {
        broadcastState();
      }
    }

    // --- Tab Switcher ---
    function switchTab(tabNum) {
      const page1 = document.getElementById('page1');
      const page2 = document.getElementById('page2');
      const tab1Btn = document.getElementById('tab1Btn');
      const tab2Btn = document.getElementById('tab2Btn');

      if (tabNum === 1) {
        page1.classList.remove('hidden');
        page2.classList.add('hidden');
        tab1Btn.className = "flex-1 py-2 rounded-lg bg-white text-japandi-text font-bold shadow-xs transition flex items-center justify-center space-x-1.5";
        tab2Btn.className = "flex-1 py-2 rounded-lg text-japandi-muted hover:text-japandi-text transition flex items-center justify-center space-x-1.5";
      } else {
        page1.classList.add('hidden');
        page2.classList.remove('hidden');
        tab2Btn.className = "flex-1 py-2 rounded-lg bg-white text-japandi-text font-bold shadow-xs transition flex items-center justify-center space-x-1.5";
        tab1Btn.className = "flex-1 py-2 rounded-lg text-japandi-muted hover:text-japandi-text transition flex items-center justify-center space-x-1.5";
        renderCalendar();
      }
    }

    // --- Member Management ---
    function renderMembers() {
      const memberList = document.getElementById('memberList');
      const memberFilter = document.getElementById('memberFilter');
      const badge = document.getElementById('memberCountBadge');

      badge.innerText = `${appState.members.length} 位朋友`;
      memberList.innerHTML = '';

      if (appState.members.length === 0) {
        memberList.innerHTML = `<div class="col-span-full py-8 text-center text-xs text-japandi-muted">尚未新增任何酒精閨蜜，請在上方新增！</div>`;
      } else {
        appState.members.forEach((m, idx) => {
          const card = document.createElement('div');
          card.className = "flex items-center justify-between p-3.5 bg-japandi-bg border border-japandi-border rounded-xl text-xs transition hover:border-japandi-accent";
          card.innerHTML = `
            <div class="flex items-center space-x-3">
              <span class="font-mono text-japandi-muted opacity-60 font-bold">${String(idx + 1).padStart(2, '0')}</span>
              <span class="font-bold text-japandi-text">${escapeHtml(m)}</span>
            </div>
            <div class="flex items-center space-x-2">
              <button onclick="filterAndGoToCalendar('${escapeHtml(m)}')" class="p-1 text-japandi-muted hover:text-japandi-text" title="查看日曆">📅</button>
              <button onclick="deleteMember('${escapeHtml(m)}')" class="p-1 text-japandi-muted hover:text-japandi-absent" title="刪除">🗑️</button>
            </div>
          `;
          memberList.appendChild(card);
        });
      }

      const currentVal = memberFilter.value;
      memberFilter.innerHTML = `<option value="ALL">全體成員總覽</option>`;
      appState.members.forEach(m => {
        const opt = document.createElement('option');
        opt.value = m;
        opt.innerText = m;
        memberFilter.appendChild(opt);
      });
      if (appState.members.includes(currentVal)) {
        memberFilter.value = currentVal;
      } else {
        memberFilter.value = 'ALL';
      }
    }

    function addMember() {
      const input = document.getElementById('newMemberName');
      const name = input.value.trim();
      if (!name) return;
      if (appState.members.includes(name)) {
        alert('該成員名稱已存在！');
        return;
      }
      appState.members.push(name);
      input.value = '';
      saveData();
      renderMembers();
    }

    function deleteMember(name) {
      if (confirm(`確定要移除「${name}」嗎？`)) {
        appState.members = appState.members.filter(m => m !== name);
        saveData();
        renderMembers();
        renderCalendar();
      }
    }

    function filterAndGoToCalendar(memberName) {
      document.getElementById('memberFilter').value = memberName;
      switchTab(2);
    }

    // --- Calendar Management ---
    function changeMonth(delta) {
      appState.currentMonth += delta;
      if (appState.currentMonth < 0) {
        appState.currentMonth = 11;
        appState.currentYear--;
      } else if (appState.currentMonth > 11) {
        appState.currentMonth = 0;
        appState.currentYear++;
      }
      renderCalendar();
    }

    function renderCalendar() {
      const grid = document.getElementById('calendarGrid');
      const label = document.getElementById('currentMonthLabel');
      const filter = document.getElementById('memberFilter').value;

      grid.innerHTML = '';
      label.innerText = `${appState.currentYear} 年 ${String(appState.currentMonth + 1).padStart(2, '0')} 月`;

      const firstDay = new Date(appState.currentYear, appState.currentMonth, 1).getDay();
      const daysInMonth = new Date(appState.currentYear, appState.currentMonth + 1, 0).getDate();

      let statSober = 0, statLeave = 0, statLate = 0, statAbsent = 0;

      for (let i = 0; i < firstDay; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = "h-20 bg-japandi-bg/40 rounded-xl border border-transparent";
        grid.appendChild(emptyCell);
      }

      const todayStr = new Date().toISOString().split('T')[0];

      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${appState.currentYear}-${String(appState.currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const isToday = (dateStr === todayStr);

        const cell = document.createElement('div');
        cell.className = `relative h-20 p-1.5 rounded-xl border transition flex flex-col justify-between cursor-pointer select-none overflow-hidden ${
          isToday ? 'bg-amber-50/60 border-amber-300' : 'bg-japandi-bg border-japandi-border hover:border-japandi-accent'
        }`;

        const topRow = document.createElement('div');
        topRow.className = "flex justify-between items-center z-10";
        topRow.innerHTML = `
          <span class="text-[11px] font-bold font-mono ${isToday ? 'text-amber-800 bg-amber-100 px-1 rounded' : 'text-japandi-text'}">${day}</span>
        `;
        cell.appendChild(topRow);

        const contentArea = document.createElement('div');
        contentArea.className = "flex-1 my-0.5 overflow-y-auto space-y-0.5 text-[9px] z-10";

        const dayRecord = appState.records[dateStr] || {};
        let dayPhoto = null;

        if (filter === 'ALL') {
          Object.keys(dayRecord).forEach(m => {
            const rec = dayRecord[m];
            if (rec.photo) dayPhoto = rec.photo;
            contentArea.appendChild(createBadge(m, rec.status, rec.note));
            if (rec.status === 'sober') statSober++;
            if (rec.status === 'leave') statLeave++;
            if (rec.status === 'late') statLate++;
            if (rec.status === 'absent') statAbsent++;
          });
        } else {
          const rec = dayRecord[filter];
          if (rec) {
            if (rec.photo) dayPhoto = rec.photo;
            contentArea.appendChild(createBadge(filter, rec.status, rec.note));
            if (rec.status === 'sober') statSober++;
            if (rec.status === 'leave') statLeave++;
            if (rec.status === 'late') statLate++;
            if (rec.status === 'absent') statAbsent++;
          }
        }

        // Render Photo Thumbnail background if available
        if (dayPhoto) {
          const imgBg = document.createElement('div');
          imgBg.className = "absolute inset-0 opacity-25 bg-cover bg-center pointer-events-none";
          imgBg.style.backgroundImage = `url(${dayPhoto})`;
          cell.appendChild(imgBg);
        }

        cell.appendChild(contentArea);

        const progress = document.createElement('div');
        progress.className = "absolute bottom-0 left-0 h-0.5 bg-japandi-accent w-0 progress-bar z-20";
        cell.appendChild(progress);

        bindLongPress(cell, dateStr, progress);
        grid.appendChild(cell);
      }

      document.getElementById('statSober').innerText = statSober;
      document.getElementById('statLeave').innerText = statLeave;
      document.getElementById('statLate').innerText = statLate;
      document.getElementById('statAbsent').innerText = statAbsent;
    }

    function createBadge(name, status, note) {
      const div = document.createElement('div');
      let style = 'bg-emerald-100 text-emerald-800 border-emerald-200';
      let icon = '✨';

      if (status === 'leave') { style = 'bg-amber-100 text-amber-800 border-amber-200'; icon = '🍹'; }
      if (status === 'late') { style = 'bg-orange-100 text-orange-800 border-orange-200'; icon = '🥴'; }
      if (status === 'absent') { style = 'bg-red-100 text-red-800 border-red-200'; icon = '🤪'; }

      div.className = `px-1 py-0.5 rounded border ${style} flex items-center justify-between truncate`;
      div.title = note ? `${name}: ${note}` : name;
      div.innerHTML = `<span class="truncate">${icon} ${escapeHtml(name)}</span>`;
      return div;
    }

    // --- Long Press Handler ---
    function bindLongPress(element, dateStr, progressEl) {
      let timer = null;
      const duration = 500;

      const start = () => {
        element.classList.add('long-press-active');
        progressEl.style.width = '100%';
        timer = setTimeout(() => {
          openRollCallModal(dateStr);
          reset();
        }, duration);
      };

      const reset = () => {
        clearTimeout(timer);
        element.classList.remove('long-press-active');
        progressEl.style.width = '0%';
      };

      element.addEventListener('touchstart', start, { passive: true });
      element.addEventListener('touchend', reset);
      element.addEventListener('touchcancel', reset);
      element.addEventListener('mousedown', start);
      element.addEventListener('mouseup', reset);
      element.addEventListener('mouseleave', reset);
    }

    // --- Modal Handler ---
    function openRollCallModal(dateStr) {
      selectedDateStr = dateStr;
      const modal = document.getElementById('rollCallModal');
      const title = document.getElementById('modalTitle');
      const subtitle = document.getElementById('modalSubTitle');
      const filter = document.getElementById('memberFilter').value;
      const memberSelectGroup = document.getElementById('modalMemberSelectGroup');
      const memberSelect = document.getElementById('modalMemberSelect');

      title.innerText = `📅 點名與回憶: ${dateStr}`;

      if (appState.members.length === 0) {
        alert('請先新增酒精閨蜜成員！');
        return;
      }

      memberSelect.innerHTML = '';
      appState.members.forEach(m => {
        const opt = document.createElement('option');
        opt.value = m;
        opt.innerText = m;
        memberSelect.appendChild(opt);
      });

      if (filter !== 'ALL') {
        memberSelect.value = filter;
        memberSelectGroup.classList.add('hidden');
        subtitle.innerText = `對象：${filter}`;
      } else {
        memberSelectGroup.classList.remove('hidden');
        subtitle.innerText = `請選擇點名對象`;
      }

      loadModalFormData();
      memberSelect.onchange = () => loadModalFormData();
      modal.classList.remove('hidden');
    }

    function loadModalFormData() {
      const memberName = document.getElementById('modalMemberSelect').value;
      const dayRecord = appState.records[selectedDateStr] || {};
      const memberRec = dayRecord[memberName];

      if (memberRec) {
        selectStatus(memberRec.status);
        document.getElementById('modalNote').value = memberRec.note || '';
        if (memberRec.photo) {
          updatePhotoPreview(memberRec.photo);
        } else {
          updatePhotoPreview(null);
        }
      } else {
        selectStatus('sober');
        document.getElementById('modalNote').value = '';
        updatePhotoPreview(null);
      }
    }

    function selectStatus(status) {
      currentSelectedStatus = status;
      ['sober', 'leave', 'late', 'absent'].forEach(s => {
        const btn = document.getElementById(`statusBtn_${s}`);
        if (s === status) {
          btn.className = "p-3 border-2 border-japandi-accent bg-white rounded-2xl text-xs font-bold flex items-center space-x-2 transition shadow-xs";
        } else {
          btn.className = "p-3 border border-japandi-border bg-japandi-bg rounded-2xl text-xs font-semibold flex items-center space-x-2 transition opacity-50";
        }
      });
    }

    // --- Photo Upload Handling ---
    function handlePhotoUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        // Compress photo to save storage/bandwidth
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const maxDim = 400; // max size
          let w = img.width, h = img.height;
          if (w > h) {
            if (w > maxDim) { h *= maxDim / w; w = maxDim; }
          } else {
            if (h > maxDim) { w *= maxDim / h; h = maxDim; }
          }
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          const compressed = canvas.toDataURL('image/jpeg', 0.7);
          updatePhotoPreview(compressed);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function updatePhotoPreview(base64) {
      currentPhotoBase64 = base64;
      const container = document.getElementById('photoPreviewContainer');
      const removeBtn = document.getElementById('removePhotoBtn');

      if (base64) {
        container.innerHTML = `<img src="${base64}" class="w-full h-full object-cover">`;
        removeBtn.classList.remove('hidden');
      } else {
        container.innerHTML = `<span class="text-japandi-muted text-xs">無照片</span>`;
        removeBtn.classList.add('hidden');
      }
    }

    function removePhoto() {
      updatePhotoPreview(null);
      document.getElementById('photoInput').value = '';
    }

    function closeModal() {
      document.getElementById('rollCallModal').classList.add('hidden');
    }

    function saveRollCall() {
      const memberName = document.getElementById('modalMemberSelect').value;
      const note = document.getElementById('modalNote').value.trim();

      if (!appState.records[selectedDateStr]) appState.records[selectedDateStr] = {};

      appState.records[selectedDateStr][memberName] = {
        status: currentSelectedStatus,
        note: note,
        photo: currentPhotoBase64
      };

      saveData();
      renderCalendar();
      closeModal();
    }

    function clearRecord() {
      const memberName = document.getElementById('modalMemberSelect').value;
      if (appState.records[selectedDateStr] && appState.records[selectedDateStr][memberName]) {
        delete appState.records[selectedDateStr][memberName];
        if (Object.keys(appState.records[selectedDateStr]).length === 0) {
          delete appState.records[selectedDateStr];
        }
        saveData();
        renderCalendar();
      }
      closeModal();
    }

    // --- JSON Backup / Restore ---
    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appState, null, 2));
      const anchor = document.createElement('a');
      anchor.setAttribute("href", dataStr);
      anchor.setAttribute("download", `drunk_memoirs_backup_${new Date().toISOString().split('T')[0]}.json`);
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (imported.members && imported.records) {
            appState.members = imported.members;
            appState.records = imported.records;
            saveData();
            renderMembers();
            renderCalendar();
            alert('回憶戰績成功還原！');
          }
        } catch(err) {
          alert('JSON 解析失敗！');
        }
      };
      reader.readAsText(file);
    }

    // --- PeerJS Cloud Realtime Sync ---
    function setupPeerSync() {
      const urlParams = new URLSearchParams(window.location.search);
      const targetRoom = urlParams.get('room');

      if (targetRoom) {
        myRoomId = targetRoom;
        document.getElementById('roomIdDisplay').innerText = myRoomId;
        connectToHost(targetRoom);
      } else {
        myRoomId = 'MEMOIR-' + Math.floor(1000 + Math.random() * 9000);
        document.getElementById('roomIdDisplay').innerText = myRoomId;
        initHostPeer();
      }
    }

    function initHostPeer() {
      peer = new Peer(myRoomId);
      peer.on('open', () => {
        document.getElementById('syncStatusDot').className = "w-2 h-2 rounded-full bg-emerald-500 inline-block";
      });
      peer.on('connection', (conn) => {
        connections.push(conn);
        conn.on('open', () => conn.send({ type: 'STATE_UPDATE', data: appState }));
        conn.on('data', (data) => {
          if (data.type === 'STATE_UPDATE') {
            appState = data.data;
            saveData(false);
            renderMembers();
            renderCalendar();
          }
        });
      });
    }

    function connectToHost(hostId) {
      peer = new Peer();
      peer.on('open', () => {
        const conn = peer.connect(hostId);
        connections.push(conn);
        conn.on('open', () => {
          document.getElementById('syncStatusDot').className = "w-2 h-2 rounded-full bg-emerald-500 inline-block";
        });
        conn.on('data', (data) => {
          if (data.type === 'STATE_UPDATE') {
            appState = data.data;
            localStorage.setItem('japandi_drunk_memoirs_data', JSON.stringify({
              members: appState.members,
              records: appState.records
            }));
            renderMembers();
            renderCalendar();
          }
        });
      });
    }

    function broadcastState() {
      connections.forEach(conn => {
        if (conn.open) conn.send({ type: 'STATE_UPDATE', data: appState });
      });
    }

    function copyShareLink() {
      const shareUrl = `${window.location.origin}${window.location.pathname}?room=${myRoomId}`;
      navigator.clipboard.writeText(shareUrl).then(() => {
        alert(`已複製共享連結！\n將連結發給朋友，即可進入同一個房間（${myRoomId}）跨裝置即時同步回憶與點名：\n${shareUrl}`);
      }).catch(() => {
        prompt("請複製以下連結發給朋友：", shareUrl);
      });
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
</body>
