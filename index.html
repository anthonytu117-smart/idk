<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>那群跟我變美(發酒癲）的朋友點名簿</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+JP:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        muji: {
                            bg: '#F7F5F0',       /* 主背景米白 */
                            card: '#FFFFFF',     /* 卡片純白 */
                            subbg: '#EFECE6',    /* 區塊淡灰 */
                            text: '#333333',     /* 主要深灰字 */
                            muted: '#8C857B',    /* 輔助灰褐字 */
                            border: '#E2DDD5',   /* 柔和邊框 */
                            accent: '#7F222B',   /* 無印經典深紅點綴 */
                            wood: '#A68A68',     /* 暖木調 */
                            // 狀態點綴色
                            present: '#4A7C59',  /* 綠 - 清醒變美 */
                            leave: '#D97706',    /* 橘/黃 - 喝茫請假 */
                            late: '#7C3AED',     /* 紫 - 微醺遲到 */
                            absent: '#C53030'    /* 紅 - 發酒癲失聯 */
                        }
                    },
                    fontFamily: {
                        sans: ['Noto Sans TC', 'sans-serif'],
                        serif: ['Noto Serif JP', 'serif']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #F7F5F0;
            color: #333333;
            -webkit-tap-highlight-color: transparent;
        }

        /* 防文字選擇 (長按時不觸發系統複製選單) */
        .prevent-select {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        /* 長按動畫反饋 */
        @keyframes longPressProgress {
            0% { width: 0%; opacity: 0.6; }
            100% { width: 100%; opacity: 1; }
        }

        .press-indicator {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            background-color: #7F222B;
            width: 0%;
            transition: width 0.05s linear;
        }

        .is-pressing .press-indicator {
            animation: longPressProgress 0.5s linear forwards;
        }

        .is-pressing {
            transform: scale(0.98);
            background-color: #EFECE6 !important;
        }

        /* 滾動條簡約化 */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #F7F5F0;
        }
        ::-webkit-scrollbar-thumb {
            background: #D5CFC5;
            border-radius: 2px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans prevent-select">

    <header class="bg-muji-card border-b border-muji-border px-4 py-4 sm:px-8">
        <div class="max-w-6xl mx-auto flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-muji-accent text-white flex items-center justify-center font-serif text-base font-semibold rounded-sm shadow-xs">
                    🍷
                </div>
                <div>
                    <h1 class="text-base sm:text-lg font-bold tracking-wider text-muji-text font-serif">
                        那群跟我變美(發酒癲）的朋友點名簿
                    </h1>
                    <p class="text-[11px] font-sans text-muji-muted font-normal">
                        Beauty & Drunk Friend Tracker
                    </p>
                </div>
            </div>

            <!-- 主分頁標籤 -->
            <nav class="flex items-center gap-1 bg-muji-subbg p-1 rounded-md text-xs font-medium">
                <button id="nav-members" onclick="switchMainTab('members')" class="px-4 py-1.5 rounded transition-all bg-muji-card text-muji-text shadow-xs">
                    <i class="fa-solid fa-users text-[11px] mr-1.5"></i>朋友名冊
                </button>
                <button id="nav-calendar" onclick="switchMainTab('calendar')" class="px-4 py-1.5 rounded transition-all text-muji-muted hover:text-muji-text">
                    <i class="fa-regular fa-calendar-check text-[11px] mr-1.5"></i>酒癲點名日曆
                </button>
            </nav>
        </div>
    </header>

    <div class="max-w-6xl w-full mx-auto p-4 sm:p-6 flex-1 flex flex-col gap-6">

        <!-- ==================== 頁面一：朋友名單管理 ==================== -->
        <section id="tab-members" class="space-y-6">
            <!-- 新增朋友卡片 -->
            <div class="bg-muji-card border border-muji-border rounded-lg p-5 sm:p-6 shadow-xs">
                <h2 class="text-sm font-semibold text-muji-text mb-4 flex items-center gap-2">
                    <span class="w-1.5 h-1.5 bg-muji-accent rounded-full"></span> 邀請酒友 / 閨蜜加入
                </h2>
                <form id="add-member-form" onsubmit="handleAddMember(event)" class="flex flex-col sm:flex-row gap-3">
                    <input type="text" id="member-name-input" placeholder="請輸入朋友暱稱（例如：喝酒奇俠、美妝小天才）" 
                           class="flex-1 bg-muji-bg border border-muji-border rounded px-4 py-2 text-sm text-muji-text placeholder:text-muji-muted/60 focus:outline-none focus:border-muji-text transition-colors"
                           maxlength="20" required>
                    <button type="submit" class="bg-muji-text hover:bg-black text-white px-6 py-2 rounded text-sm font-medium transition-colors shrink-0 flex items-center justify-center gap-2">
                        <i class="fa-solid fa-plus text-xs"></i> 入冊加入
                    </button>
                </form>
            </div>

            <!-- 朋友列表區塊 -->
            <div class="bg-muji-card border border-muji-border rounded-lg p-5 sm:p-6 shadow-xs">
                <div class="flex items-center justify-between mb-4 border-b border-muji-subbg pb-3">
                    <div class="flex items-center gap-2">
                        <h2 class="text-sm font-semibold text-muji-text">酒瘋閨蜜總覽</h2>
                        <span id="member-count-tag" class="text-xs bg-muji-subbg text-muji-muted px-2 py-0.5 rounded">0 人</span>
                    </div>
                    <div class="flex items-center gap-3 text-xs">
                        <button onclick="exportData()" class="text-muji-muted hover:text-muji-text flex items-center gap-1">
                            <i class="fa-solid fa-download"></i> 備份戰績
                        </button>
                        <label class="text-muji-muted hover:text-muji-text cursor-pointer flex items-center gap-1">
                            <i class="fa-solid fa-upload"></i> 還原戰績
                            <input type="file" accept=".json" onchange="importData(event)" class="hidden">
                        </label>
                    </div>
                </div>

                <!-- 名單 Grid -->
                <div id="member-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                    <!-- 動態注入成員卡片 -->
                </div>

                <!-- 空狀態提示 -->
                <div id="member-empty-notice" class="hidden py-12 text-center text-muji-muted text-xs">
                    <i class="fa-solid fa-wine-glass-empty text-2xl mb-2 block opacity-40"></i>
                    目前還沒有朋友名單，快在上方加入你的發酒癲閨蜜吧！
                </div>
            </div>
        </section>


        <!-- ==================== 頁面二：酒癲點名日曆 ==================== -->
        <section id="tab-calendar" class="hidden space-y-4 flex-1 flex flex-col">
            
            <!-- 上方控制列 -->
            <div class="bg-muji-card border border-muji-border rounded-lg p-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 shadow-xs">
                
                <!-- 切換檢視對象 -->
                <div class="flex items-center gap-2 w-full sm:w-auto">
                    <span class="text-xs text-muji-muted shrink-0">觀察對象：</span>
                    <select id="person-select" onchange="handlePersonChange(this.value)" class="bg-muji-bg border border-muji-border rounded px-3 py-1.5 text-xs font-medium text-muji-text focus:outline-none focus:border-muji-text transition-colors flex-1 sm:w-52">
                        <!-- 動態生成選項 -->
                    </select>
                </div>

                <!-- 日曆月份切換 -->
                <div class="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-end">
                    <div class="flex items-center gap-1">
                        <button onclick="changeMonth(-1)" class="w-7 h-7 rounded border border-muji-border hover:bg-muji-subbg flex items-center justify-center text-xs text-muji-text transition-colors">
                            <i class="fa-solid fa-chevron-left"></i>
                        </button>
                        <button onclick="goToToday()" class="px-2.5 py-1 rounded border border-muji-border hover:bg-muji-subbg text-xs font-medium text-muji-text transition-colors">
                            今天
                        </button>
                        <button onclick="changeMonth(1)" class="w-7 h-7 rounded border border-muji-border hover:bg-muji-subbg flex items-center justify-center text-xs text-muji-text transition-colors">
                            <i class="fa-solid fa-chevron-right"></i>
                        </button>
                    </div>
                    <span id="calendar-title" class="text-sm font-bold text-muji-text font-serif tracking-wider">2026年 09月</span>
                </div>
            </div>

            <!-- 月度酒癲變美統計 -->
            <div id="stats-bar" class="bg-muji-card border border-muji-border rounded-lg p-3 px-4 flex flex-wrap items-center justify-between text-xs text-muji-muted gap-2">
                <span class="font-medium text-muji-text" id="stats-title">本月戰況統計</span>
                <div class="flex flex-wrap items-center gap-3 text-[11px]">
                    <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-muji-present"></span> ✨ 清醒變美: <strong id="stat-present" class="text-muji-text">0</strong> 天</span>
                    <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-muji-leave"></span> 🍹 喝茫請假: <strong id="stat-leave" class="text-muji-text">0</strong> 天</span>
                    <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-muji-late"></span> 🥴 微醺遲到: <strong id="stat-late" class="text-muji-text">0</strong> 天</span>
                    <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-muji-absent"></span> 🤪 發酒癲失聯: <strong id="stat-absent" class="text-muji-text">0</strong> 天</span>
                </div>
            </div>

            <!-- 操作提示 -->
            <div class="text-[11px] text-muji-muted flex items-center gap-1 px-1">
                <i class="fa-solid fa-hand-pointer text-muji-accent"></i>
                <span>操作小秘訣：在任何日期上<b>長按 (0.5秒)</b> 或點擊，即可開啟點名視窗，紀錄當天誰在變美、誰又發酒癲！</span>
            </div>

            <!-- 日曆網格 -->
            <div class="bg-muji-card border border-muji-border rounded-lg p-3 sm:p-4 flex-1 flex flex-col shadow-xs">
                <!-- 星期表頭 -->
                <div class="grid grid-cols-7 gap-1 text-center font-medium text-xs text-muji-muted border-b border-muji-subbg pb-2 mb-2">
                    <div class="text-muji-accent">日</div>
                    <div>一</div>
                    <div>二</div>
                    <div>三</div>
                    <div>四</div>
                    <div>五</div>
                    <div>六</div>
                </div>

                <!-- 日期矩陣 -->
                <div id="calendar-grid" class="grid grid-cols-7 gap-1.5 flex-1 auto-rows-fr">
                    <!-- 動態生成日曆格 -->
                </div>
            </div>
        </section>

    </div>


    <!-- Modal 彈出點名視窗 -->
    <div id="attendance-modal" class="fixed inset-0 z-50 bg-black/30 backdrop-blur-xs flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-200">
        <div class="bg-muji-card border border-muji-border rounded-lg shadow-xl max-w-md w-full overflow-hidden transform scale-95 transition-transform duration-200 flex flex-col max-h-[85vh]" id="modal-content">
            
            <!-- Modal Header -->
            <div class="bg-muji-subbg px-5 py-3.5 border-b border-muji-border flex justify-between items-center">
                <div>
                    <h3 id="modal-date-title" class="text-sm font-bold text-muji-text font-serif">2026-09-19 點名登記</h3>
                    <p id="modal-subtitle" class="text-xs text-muji-muted mt-0.5">登記大家今天的變美與酒癲戰況 🥂</p>
                </div>
                <button onclick="closeModal()" class="text-muji-muted hover:text-muji-text text-sm w-7 h-7 flex items-center justify-center">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- Modal Content (表單內容) -->
            <div class="p-5 overflow-y-auto space-y-4 flex-1" id="modal-body-container">
                <!-- 動態注入點名表單項目 -->
            </div>

            <!-- Modal Footer -->
            <div class="px-5 py-3.5 bg-muji-subbg border-t border-muji-border flex justify-end gap-2">
                <button onclick="closeModal()" class="px-4 py-1.5 rounded text-xs text-muji-muted hover:text-muji-text font-medium transition-colors">取消</button>
                <button onclick="saveAttendanceRecord()" class="px-5 py-1.5 rounded bg-muji-text hover:bg-black text-white text-xs font-medium transition-colors">儲存紀錄</button>
            </div>
        </div>
    </div>


    <script>
        // 趣味點名狀態類型庫
        const STATUS_TYPES = {
            'present': { label: '✨ 清醒變美', icon: '✨', bg: 'bg-muji-present', text: 'text-muji-present', badge: 'bg-emerald-50 text-emerald-800 border-emerald-200' },
            'leave':   { label: '🍹 喝茫請假', icon: '🍹', bg: 'bg-muji-leave',   text: 'text-muji-leave',   badge: 'bg-amber-50 text-amber-800 border-amber-200' },
            'late':    { label: '🥴 微醺遲到', icon: '🥴', bg: 'bg-muji-late',    text: 'text-muji-late',    badge: 'bg-purple-50 text-purple-800 border-purple-200' },
            'absent':  { label: '🤪 發酒癲失聯', icon: '🤪', bg: 'bg-muji-absent',  text: 'text-muji-absent',  badge: 'bg-rose-50 text-rose-800 border-rose-200' }
        };

        // 全局應用狀態
        let currentTab = 'members';
        let members = [];
        let selectedPersonId = 'ALL';
        
        // 點名資料結構: { 'YYYY-MM-DD': { memberId: { status: 'present'|'leave'|'late'|'absent', note: '戰績或備註' } } }
        let attendanceData = {}; 

        // 當前日曆指標
        let calendarYear = new Date().getFullYear();
        let calendarMonth = new Date().getMonth();

        // 長按控制變數
        let pressTimer = null;
        let pressTarget = null;
        let isLongPressed = false;
        let activeModalDate = null;
        let tempModalState = {};

        // 頁面初始化
        window.onload = function() {
            loadFromStorage();
            renderMembers();
            populatePersonDropdown();
            renderCalendar();
        };

        function loadFromStorage() {
            try {
                const savedMembers = localStorage.getItem('muji_drunk_members');
                if (savedMembers) {
                    members = JSON.parse(savedMembers);
                } else {
                    // 預設趣味範例朋友名單
                    members = [
                        { id: 'm_1', name: '美麗擔當 莉莉' },
                        { id: 'm_2', name: '酒王 威廉' },
                        { id: 'm_3', name: '酒癲戰術大師 Eva' }
                    ];
                    saveMembersToStorage();
                }

                const savedData = localStorage.getItem('muji_drunk_attendance_data');
                if (savedData) {
                    attendanceData = JSON.parse(savedData);
                }
            } catch (e) {
                console.error("讀取 LocalStorage 發生錯誤:", e);
            }
        }

        function saveMembersToStorage() {
            localStorage.setItem('muji_drunk_members', JSON.stringify(members));
        }

        function saveAttendanceToStorage() {
            localStorage.setItem('muji_drunk_attendance_data', JSON.stringify(attendanceData));
        }

        function switchMainTab(tab) {
            currentTab = tab;
            const tabMembers = document.getElementById('tab-members');
            const tabCalendar = document.getElementById('tab-calendar');
            const navMembers = document.getElementById('nav-members');
            const navCalendar = document.getElementById('nav-calendar');

            if (tab === 'members') {
                tabMembers.classList.remove('hidden');
                tabCalendar.classList.add('hidden');
                navMembers.className = "px-4 py-1.5 rounded transition-all bg-muji-card text-muji-text shadow-xs";
                navCalendar.className = "px-4 py-1.5 rounded transition-all text-muji-muted hover:text-muji-text";
            } else {
                tabMembers.classList.add('hidden');
                tabCalendar.classList.remove('hidden');
                navCalendar.className = "px-4 py-1.5 rounded transition-all bg-muji-card text-muji-text shadow-xs";
                navMembers.className = "px-4 py-1.5 rounded transition-all text-muji-muted hover:text-muji-text";
                
                populatePersonDropdown();
                renderCalendar();
            }
        }

        function handleAddMember(e) {
            e.preventDefault();
            const input = document.getElementById('member-name-input');
            const name = input.value.trim();
            if (!name) return;

            const newMember = {
                id: 'm_' + Date.now() + '_' + Math.floor(Math.random()*1000),
                name: name
            };

            members.push(newMember);
            saveMembersToStorage();
            input.value = '';
            renderMembers();
            populatePersonDropdown();
        }

        function deleteMember(id) {
            if (confirm('確定要將這位朋友從點名簿中移除嗎？')) {
                members = members.filter(m => m.id !== id);
                saveMembersToStorage();
                renderMembers();
                populatePersonDropdown();
            }
        }

        function viewMemberCalendar(id) {
            selectedPersonId = id;
            switchMainTab('calendar');
        }

        function renderMembers() {
            const grid = document.getElementById('member-grid');
            const emptyNotice = document.getElementById('member-empty-notice');
            const countTag = document.getElementById('member-count-tag');

            countTag.innerText = `${members.length} 位朋友`;

            if (members.length === 0) {
                grid.innerHTML = '';
                emptyNotice.classList.remove('hidden');
                return;
            }

            emptyNotice.classList.add('hidden');
            grid.innerHTML = members.map((m, idx) => `
                <div class="bg-muji-bg border border-muji-border rounded p-3.5 flex items-center justify-between hover:border-muji-text transition-colors">
                    <div class="flex items-center gap-3">
                        <span class="text-xs font-serif text-muji-muted w-5 text-center">${String(idx + 1).padStart(2, '0')}</span>
                        <span class="text-sm font-medium text-muji-text font-serif">${escapeHtml(m.name)}</span>
                    </div>
                    <div class="flex items-center gap-1">
                        <button onclick="viewMemberCalendar('${m.id}')" title="查看個人戰績" class="text-xs text-muji-muted hover:text-muji-text px-2 py-1 rounded hover:bg-muji-subbg transition-colors">
                            <i class="fa-regular fa-calendar-days"></i>
                        </button>
                        <button onclick="deleteMember('${m.id}')" title="刪除" class="text-xs text-muji-muted hover:text-muji-accent px-2 py-1 rounded hover:bg-muji-subbg transition-colors">
                            <i class="fa-regular fa-trash-can"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function populatePersonDropdown() {
            const select = document.getElementById('person-select');
            let html = `<option value="ALL">全體姐妹酒友 (總覽)</option>`;
            members.forEach(m => {
                html += `<option value="${m.id}" ${selectedPersonId === m.id ? 'selected' : ''}>${escapeHtml(m.name)}</option>`;
            });
            select.innerHTML = html;
        }

        function handlePersonChange(val) {
            selectedPersonId = val;
            renderCalendar();
        }


        function changeMonth(delta) {
            calendarMonth += delta;
            if (calendarMonth > 11) {
                calendarMonth = 0;
                calendarYear++;
            } else if (calendarMonth < 0) {
                calendarMonth = 11;
                calendarYear--;
            }
            renderCalendar();
        }

        function goToToday() {
            const now = new Date();
            calendarYear = now.getFullYear();
            calendarMonth = now.getMonth();
            renderCalendar();
        }

        function renderCalendar() {
            const titleEl = document.getElementById('calendar-title');
            const gridEl = document.getElementById('calendar-grid');

            titleEl.innerText = `${calendarYear}年 ${String(calendarMonth + 1).padStart(2, '0')}月`;

            const firstDayIndex = new Date(calendarYear, calendarMonth, 1).getDay();
            const daysInMonth = new Date(calendarYear, calendarMonth + 1, 0).getDate();
            const daysInPrevMonth = new Date(calendarYear, calendarMonth, 0).getDate();

            const todayStr = formatDateKey(new Date());

            let html = '';

            // 上月空白補位
            for (let i = firstDayIndex - 1; i >= 0; i--) {
                const day = daysInPrevMonth - i;
                html += `<div class="bg-muji-subbg/30 text-muji-muted/40 rounded p-1.5 min-h-[70px] sm:min-h-[85px] border border-transparent select-none pointer-events-none">
                    <span class="text-[11px] font-serif">${day}</span>
                </div>`;
            }

            // 月統計歸零
            let statPresent = 0, statLeave = 0, statLate = 0, statAbsent = 0;

            // 當月日期繪製
            for (let day = 1; day <= daysInMonth; day++) {
                const dateKey = `${calendarYear}-${String(calendarMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const isToday = dateKey === todayStr;

                const dayRecords = attendanceData[dateKey] || {};

                let contentHtml = '';

                if (selectedPersonId !== 'ALL') {
                    // 個人模式
                    const rec = dayRecords[selectedPersonId];
                    if (rec) {
                        const typeInfo = STATUS_TYPES[rec.status] || STATUS_TYPES['present'];
                        // 統計累加
                        if (rec.status === 'present') statPresent++;
                        else if (rec.status === 'leave') statLeave++;
                        else if (rec.status === 'late') statLate++;
                        else if (rec.status === 'absent') statAbsent++;

                        contentHtml = `
                            <div class="mt-1 space-y-0.5">
                                <span class="inline-block text-[10px] font-medium px-1.5 py-0.5 rounded border ${typeInfo.badge}">
                                    ${typeInfo.label}
                                </span>
                                ${rec.note ? `<p class="text-[10px] text-muji-muted truncate" title="${escapeHtml(rec.note)}">${escapeHtml(rec.note)}</p>` : ''}
                            </div>
                        `;
                    }
                } else {
                    // 總覽模式
                    const recKeys = Object.keys(dayRecords);
                    if (recKeys.length > 0) {
                        let p = 0, l = 0, lt = 0, a = 0;
                        recKeys.forEach(mId => {
                            const st = dayRecords[mId].status;
                            if (st === 'present') { p++; statPresent++; }
                            else if (st === 'leave') { l++; statLeave++; }
                            else if (st === 'late') { lt++; statLate++; }
                            else if (st === 'absent') { a++; statAbsent++; }
                        });

                        contentHtml = `
                            <div class="mt-1 flex flex-wrap gap-1">
                                ${p > 0 ? `<span class="w-2 h-2 rounded-full bg-muji-present" title="清醒變美:${p}"></span>` : ''}
                                ${l > 0 ? `<span class="w-2 h-2 rounded-full bg-muji-leave" title="喝茫請假:${l}"></span>` : ''}
                                ${lt > 0 ? `<span class="w-2 h-2 rounded-full bg-muji-late" title="微醺遲到:${lt}"></span>` : ''}
                                ${a > 0 ? `<span class="w-2 h-2 rounded-full bg-muji-absent" title="發酒癲失聯:${a}"></span>` : ''}
                            </div>
                            <div class="text-[9px] text-muji-muted mt-1">已記錄 ${recKeys.length}/${members.length}</div>
                        `;
                    }
                }

                html += `
                    <div class="calendar-cell relative bg-muji-card hover:bg-muji-subbg/50 rounded p-1.5 sm:p-2 min-h-[70px] sm:min-h-[85px] border ${isToday ? 'border-muji-accent ring-1 ring-muji-accent/30' : 'border-muji-border'} 
                         transition-all cursor-pointer flex flex-col justify-between overflow-hidden select-none"
                         data-date="${dateKey}"
                         onmousedown="startPress(event, '${dateKey}')"
                         onmouseup="endPress(event, '${dateKey}')"
                         onmouseleave="cancelPress(event)"
                         ontouchstart="startPress(event, '${dateKey}')"
                         ontouchend="endPress(event, '${dateKey}')"
                         ontouchcancel="cancelPress(event)">
                        
                        <div class="flex justify-between items-center">
                            <span class="text-xs font-serif ${isToday ? 'font-bold text-muji-accent' : 'text-muji-text'}">${day}</span>
                        </div>

                        ${contentHtml}

                        <!-- 長按指示條 -->
                        <div class="press-indicator"></div>
                    </div>
                `;
            }

            // 下月空白補位
            const totalCells = firstDayIndex + daysInMonth;
            const nextDays = (totalCells > 35 ? 42 : 35) - totalCells;
            for (let i = 1; i <= nextDays; i++) {
                html += `<div class="bg-muji-subbg/30 text-muji-muted/40 rounded p-1.5 min-h-[70px] sm:min-h-[85px] border border-transparent select-none pointer-events-none">
                    <span class="text-[11px] font-serif">${i}</span>
                </div>`;
            }

            gridEl.innerHTML = html;

            // 更新戰況統計
            document.getElementById('stat-present').innerText = statPresent;
            document.getElementById('stat-leave').innerText = statLeave;
            document.getElementById('stat-late').innerText = statLate;
            document.getElementById('stat-absent').innerText = statAbsent;
        }


        function startPress(e, dateKey) {
            isLongPressed = false;
            pressTarget = e.currentTarget;
            pressTarget.classList.add('is-pressing');

            pressTimer = setTimeout(() => {
                isLongPressed = true;
                if (pressTarget) pressTarget.classList.remove('is-pressing');
                openModal(dateKey);
            }, 450);
        }

        function endPress(e, dateKey) {
            if (pressTimer) {
                clearTimeout(pressTimer);
                pressTimer = null;
            }
            if (pressTarget) {
                pressTarget.classList.remove('is-pressing');
            }

            if (!isLongPressed && pressTarget) {
                openModal(dateKey);
            }
            pressTarget = null;
        }

        function cancelPress(e) {
            if (pressTimer) {
                clearTimeout(pressTimer);
                pressTimer = null;
            }
            if (pressTarget) {
                pressTarget.classList.remove('is-pressing');
                pressTarget = null;
            }
        }


        function openModal(dateKey) {
            activeModalDate = dateKey;
            document.getElementById('modal-date-title').innerText = `${dateKey} 酒癲與變美紀錄`;

            const existingDayData = attendanceData[dateKey] || {};
            tempModalState = {};

            members.forEach(m => {
                if (existingDayData[m.id]) {
                    tempModalState[m.id] = { ...existingDayData[m.id] };
                } else {
                    tempModalState[m.id] = { status: 'present', note: '' };
                }
            });

            renderModalBody();

            const modal = document.getElementById('attendance-modal');
            const modalContent = document.getElementById('modal-content');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
                modalContent.classList.add('scale-100');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('attendance-modal');
            const modalContent = document.getElementById('modal-content');
            modal.classList.add('opacity-0');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        function updateTempStatus(memberId, status) {
            if (!tempModalState[memberId]) tempModalState[memberId] = { status: 'present', note: '' };
            tempModalState[memberId].status = status;
            renderModalBody();
        }

        function updateTempNote(memberId, note) {
            if (!tempModalState[memberId]) tempModalState[memberId] = { status: 'present', note: '' };
            tempModalState[memberId].note = note;
        }

        function renderModalBody() {
            const container = document.getElementById('modal-body-container');

            if (members.length === 0) {
                container.innerHTML = `<div class="text-center py-6 text-xs text-muji-muted">尚無朋友名冊，請先至第一頁「朋友名冊」新增閨蜜！</div>`;
                return;
            }

            container.innerHTML = members.map(m => {
                const state = tempModalState[m.id] || { status: 'present', note: '' };

                return `
                    <div class="bg-muji-bg border border-muji-border rounded p-3 space-y-2">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                            <span class="text-xs font-serif font-bold text-muji-text flex items-center gap-1.5">
                                🥂 ${escapeHtml(m.name)}
                            </span>
                            
                            <!-- 狀態切換按鈕 -->
                            <div class="flex items-center gap-1 bg-muji-card p-0.5 rounded border border-muji-border overflow-x-auto">
                                ${Object.keys(STATUS_TYPES).map(stKey => {
                                    const st = STATUS_TYPES[stKey];
                                    const isSel = state.status === stKey;
                                    return `
                                        <button type="button" onclick="updateTempStatus('${m.id}', '${stKey}')"
                                                class="px-2 py-1 rounded text-[10px] transition-all font-medium whitespace-nowrap ${isSel ? 'bg-muji-text text-white shadow-xs' : 'text-muji-muted hover:text-muji-text'}">
                                            ${st.label}
                                        </button>
                                    `;
                                }).join('')}
                            </div>
                        </div>

                        <!-- 戰績備註輸入框 -->
                        <input type="text" placeholder="戰績/醉酒事由（如：喝了三瓶香檳、敷面膜變美）" 
                               value="${escapeHtml(state.note || '')}"
                               onchange="updateTempNote('${m.id}', this.value)"
                               class="w-full bg-muji-card border border-muji-border rounded px-2.5 py-1 text-[11px] text-muji-text placeholder:text-muji-muted/50 focus:outline-none focus:border-muji-text">
                    </div>
                `;
            }).join('');
        }

        function saveAttendanceRecord() {
            if (!activeModalDate) return;

            attendanceData[activeModalDate] = { ...tempModalState };
            saveAttendanceToStorage();
            closeModal();
            renderCalendar();
        }


        function exportData() {
            const backupObj = {
                members: members,
                attendanceData: attendanceData,
                exportAt: new Date().toISOString()
            };
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupObj, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `friends_drunk_backup_${formatDateKey(new Date())}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (imported.members && imported.attendanceData) {
                        members = imported.members;
                        attendanceData = imported.attendanceData;
                        saveMembersToStorage();
                        saveAttendanceToStorage();
                        renderMembers();
                        populatePersonDropdown();
                        renderCalendar();
                        alert('成功還原酒友戰績備份！');
                    } else {
                        alert('備份檔案格式不正確。');
                    }
                } catch (err) {
                    alert('無法讀取檔案，請確認為有效的 JSON 備份檔。');
                }
            };
            reader.readAsText(file);
        }

        /* 輔助工具 */
        function formatDateKey(dateObj) {
            const y = dateObj.getFullYear();
            const m = String(dateObj.getMonth() + 1).padStart(2, '0');
            const d = String(dateObj.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }
    </script>
</body>
</html>
